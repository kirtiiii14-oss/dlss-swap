<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <pattern id="grain" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <rect x="0" y="0" width="1" height="1" fill="#e8f0ff" opacity="0.04"/>
      <rect x="2" y="2" width="1" height="1" fill="#00e5ff" opacity="0.03"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" fill="#0a0e1a"/>

  <!-- Outer square frame -->
  <rect x="12" y="12" width="232" height="232" fill="none" stroke="#e8f0ff" stroke-width="2" opacity="0.15"/>
  <rect x="20" y="20" width="216" height="216" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.3"/>

  <!-- Corner accents -->
  <path d="M12 32 L12 12 L32 12" fill="none" stroke="#ff2e88" stroke-width="3"/>
  <path d="M224 12 L244 12 L244 32" fill="none" stroke="#ff2e88" stroke-width="3"/>
  <path d="M12 224 L12 244 L32 244" fill="none" stroke="#00e5ff" stroke-width="3"/>
  <path d="M244 224 L244 244 L224 244" fill="none" stroke="#00e5ff" stroke-width="3"/>

  <!-- Chroma-shifted glow behind the lower die plate -->
  <path d="M60 170 L196 170 L196 210 L60 210 Z" fill="#ff2e88" opacity="0.15" transform="translate(-3,0)"/>
  <path d="M60 170 L196 170 L196 210 L60 210 Z" fill="#00e5ff" opacity="0.15" transform="translate(3,0)"/>

  <!-- Lower GPU die plate (interlocked base) -->
  <polygon points="60,160 196,160 196,210 60,210" fill="#0a0e1a" stroke="#e8f0ff" stroke-width="2.5"/>
  <polygon points="60,160 196,160 196,210 60,210" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.5"/>

  <!-- Die grid pattern on lower plate -->
  <line x1="60" y1="176" x2="196" y2="176" stroke="#00e5ff" stroke-width="0.8" opacity="0.3"/>
  <line x1="60" y1="193" x2="196" y2="193" stroke="#00e5ff" stroke-width="0.8" opacity="0.3"/>
  <line x1="88" y1="160" x2="88" y2="210" stroke="#00e5ff" stroke-width="0.8" opacity="0.2"/>
  <line x1="118" y1="160" x2="118" y2="210" stroke="#00e5ff" stroke-width="0.8" opacity="0.2"/>
  <line x1="150" y1="160" x2="150" y2="210" stroke="#00e5ff" stroke-width="0.8" opacity="0.2"/>
  <line x1="178" y1="160" x2="178" y2="210" stroke="#00e5ff" stroke-width="0.8" opacity="0.2"/>

  <!-- Glowing photon / die inside lower plate -->
  <rect x="112" y="180" width="32" height="16" fill="#00e5ff" opacity="0.6"/>
  <rect x="116" y="184" width="24" height="8" fill="#e8f0ff" opacity="0.9"/>

  <!-- Upper GPU die plate (lifting off, offset up-left, rotated) -->
  <g transform="translate(-18,-32) rotate(-4, 128, 120)">
    <!-- Chroma shadow -->
    <polygon points="66,100 194,88 202,146 74,158" fill="#ff2e88" opacity="0.12" transform="translate(-3,0)"/>
    <polygon points="66,100 194,88 202,146 74,158" fill="#00e5ff" opacity="0.12" transform="translate(3,0)"/>

    <!-- Main plate -->
    <polygon points="66,100 194,88 202,146 74,158" fill="#0a0e1a" stroke="#e8f0ff" stroke-width="2.5"/>
    <polygon points="66,100 194,88 202,146 74,158" fill="none" stroke="#ff2e88" stroke-width="1" opacity="0.5"/>

    <!-- Die grid on upper plate -->
    <line x1="80" y1="108" x2="188" y2="98" stroke="#ff2e88" stroke-width="0.8" opacity="0.3"/>
    <line x1="86" y1="128" x2="194" y2="118" stroke="#ff2e88" stroke-width="0.8" opacity="0.3"/>
    <line x1="70" y1="112" x2="80" y2="154" stroke="#ff2e88" stroke-width="0.8" opacity="0.2"/>
    <line x1="112" y1="106" x2="122" y2="156" stroke="#ff2e88" stroke-width="0.8" opacity="0.2"/>
    <line x1="155" y1="100" x2="164" y2="150" stroke="#ff2e88" stroke-width="0.8" opacity="0.2"/>

    <!-- Glowing component on upper plate -->
    <rect x="108" y="116" width="28" height="12" fill="#ff2e88" opacity="0.5" transform="rotate(-3, 122, 122)"/>
    <rect x="112" y="119" width="20" height="6" fill="#e8f0ff" opacity="0.8" transform="rotate(-3, 122, 122)"/>
  </g>

  <!-- Interlock / swap energy between plates -->
  <path d="M100 150 L110 158 L100 166" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linejoin="miter"/>
  <path d="M156 150 L146 158 L156 166" fill="none" stroke="#ff2e88" stroke-width="2.5" stroke-linejoin="miter"/>

  <!-- Swap arrows -->
  <path d="M96 218 L108 218 L104 214 M104 214 L100 218 L104 222" fill="none" stroke="#00e5ff" stroke-width="2"/>
  <path d="M160 218 L148 218 L152 214 M152 214 L156 218 L152 222" fill="none" stroke="#ff2e88" stroke-width="2"/>

  <!-- Small wordmark -->
  <text x="128" y="240" text-anchor="middle" font-family="monospace" font-size="9" fill="#e8f0ff" opacity="0.5" letter-spacing="3">DLSS-SWAP</text>

  <!-- CRT grain overlay -->
  <rect width="256" height="256" fill="url(#grain)" opacity="0.8"/>

  <!-- Scanline effect -->
  <line x1="20" y1="64" x2="236" y2="64" stroke="#e8f0ff" stroke-width="0.5" opacity="0.06"/>
  <line x1="20" y1="128" x2="236" y2="128" stroke="#e8f0ff" stroke-width="0.5" opacity="0.06"/>
  <line x1="20" y1="192" x2="236" y2="192" stroke="#e8f0ff" stroke-width="0.5" opacity="0.06"/>

  <!-- Chromatic aberration accents on frame -->
  <path d="M12 12 L12 32" stroke="#ff2e88" stroke-width="3" opacity="0.4" transform="translate(-2,0)"/>
  <path d="M244 12 L244 32" stroke="#00e5ff" stroke-width="3" opacity="0.4" transform="translate(2,0)"/>
</svg>
